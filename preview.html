  <title>Fifteen</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Fifteen home"><span>15</span> FIFTEEN</a>
    <button id="soundBtn" class="sound" aria-pressed="false"><span class="sound-icon">◖</span><span class="sound-label">sound off</span></button>
  </header>

  <main>
    <section id="home" class="view home-view active" aria-labelledby="homeTitle">
      <div class="intro">
        <p class="eyebrow">A pocket shelf of tiny breaks</p>
        <h1 id="homeTitle">Pick a feeling.<br><em>Play for fifteen.</em></h1>
        <p>No streaks. No scores. Just something satisfying to do with your hands.</p>
      </div>
      <div class="shelf" aria-label="Stress busters">
        <button class="toy-card smash-card" data-toy="smash">
          <span class="card-no">01</span><span class="card-time">15 sec</span>
          <span class="mini-smash" aria-hidden="true">UGH</span>
          <span class="card-copy"><strong>Smash</strong><small>write it, then wreck it</small></span>
          <span class="card-arrow">↗</span>
        </button>
        <button class="toy-card bubble-card" data-toy="bubble">
          <span class="card-no">02</span><span class="card-time">free play</span>
          <span class="mini-bubbles" aria-hidden="true"></span>
          <span class="card-copy"><strong>Bubble Wrap</strong><small>pop every last one</small></span>
          <span class="card-arrow">↗</span>
        </button>
        <button class="toy-card soap-card" data-toy="soap">
          <span class="card-no">03</span><span class="card-time">15 sec</span>
          <span class="mini-soap" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="card-copy"><strong>Soap Slice</strong><small>slow, soft, clean</small></span>
          <span class="card-arrow">↗</span>
        </button>
      </div>
    </section>

    <section id="play" class="view play-view" aria-live="polite">
      <div class="play-head">
        <button id="backBtn" class="back">← shelf</button>
        <div class="timer"><span id="timerText">15</span><i><b id="timerBar"></b></i></div>
        <button id="resetBtn" class="reset">again ↻</button>
      </div>
      <div id="toyStage" class="toy-stage"></div>
      <p id="hint" class="hint"></p>
    </section>
  </main>

  <footer><span>three tiny breaks</span><span>prototype · v0.1</span></footer>
  <div id="toast" role="status"></div>
  <script>const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let current=null, seconds=15, ticker=null, audio=null, sound=false;
const home=$('#home'), play=$('#play'), stage=$('#toyStage'), hint=$('#hint'), toast=$('#toast');
window.__fifteenSoundAudit={last:null,counts:{smash:0,bubble:0,soap:0}};

function noiseBuffer(ctx,dur){const n=Math.max(1,Math.floor(ctx.sampleRate*dur)),b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return b}
function smashSound(){const a=ensureAudio();if(!a)return;markSound('smash');const now=a.currentTime,master=a.createGain();master.gain.setValueAtTime(.28,now);master.gain.exponentialRampToValueAtTime(.001,now+.72);master.connect(a.destination);const hit=a.createBufferSource(),hf=a.createBiquadFilter(),hg=a.createGain();hit.buffer=noiseBuffer(a,.11);hf.type='lowpass';hf.frequency.value=900;hg.gain.setValueAtTime(.7,now);hg.gain.exponentialRampToValueAtTime(.001,now+.13);hit.connect(hf).connect(hg).connect(master);hit.start(now);const boing=a.createOscillator(),bg=a.createGain();boing.type='sine';boing.frequency.setValueAtTime(170,now+.035);boing.frequency.exponentialRampToValueAtTime(48,now+.48);boing.detune.setValueAtTime(0,now);boing.detune.linearRampToValueAtTime(-280,now+.48);bg.gain.setValueAtTime(.001,now);bg.gain.linearRampToValueAtTime(.75,now+.045);bg.gain.exponentialRampToValueAtTime(.001,now+.55);boing.connect(bg).connect(master);boing.start(now);boing.stop(now+.58);const honk=a.createOscillator(),q=a.createBiquadFilter(),qg=a.createGain();honk.type='sawtooth';honk.frequency.setValueAtTime(120,now+.16);honk.frequency.exponentialRampToValueAtTime(72,now+.4);q.type='bandpass';q.frequency.value=420;q.Q.value=6;qg.gain.setValueAtTime(.001,now);qg.gain.linearRampToValueAtTime(.12,now+.18);qg.gain.exponentialRampToValueAtTime(.001,now+.44);honk.connect(q).connect(qg).connect(master);honk.start(now+.15);honk.stop(now+.46)}
function bubbleSound(){const a=ensureAudio();if(!a)return;markSound('bubble');const now=a.currentTime,n=window.__fifteenSoundAudit.counts.bubble,o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();o.type=n%5===0?'square':'sine';const base=[520,670,590,760,430][n%5];o.frequency.setValueAtTime(base,now);o.frequency.exponentialRampToValueAtTime(base*(n%2?1.42:.58),now+.075);f.type='highpass';f.frequency.value=180;g.gain.setValueAtTime(.14,now);g.gain.exponentialRampToValueAtTime(.001,now+.09);o.connect(f).connect(g).connect(a.destination);o.start(now);o.stop(now+.095)}

function soundToggleCue(){const a=ensureAudio();if(!a)return;const o=a.createOscillator(),g=a.createGain(),now=a.currentTime;o.frequency.value=360;g.gain.setValueAtTime(.025,now);g.gain.exponentialRampToValueAtTime(.001,now+.06);o.connect(g).connect(a.destination);o.start(now);o.stop(now+.07)}
function buzz(pattern=12){if(navigator.vibrate)navigator.vibrate(pattern)}
function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toast.classList.remove('show'),1300)}
function setTimer(on=true){clearInterval(ticker);seconds=15;$('#timerText').textContent='15';$('#timerBar').style.transform='scaleX(1)';$('.timer').style.opacity=on?'1':'.35';if(!on)return;ticker=setInterval(()=>{seconds--;$('#timerText').textContent=String(seconds).padStart(2,'0');$('#timerBar').style.transform=`scaleX(${seconds/15})`;if(seconds<=0){clearInterval(ticker);showToast('time. breathe. again?')}},1000)}
function openToy(name){current=name;home.classList.remove('active');play.classList.add('active');render();location.hash=name}
function closeToy(){current=null;clearInterval(ticker);play.classList.remove('active');home.classList.add('active');location.hash=''}
function render(){stage.className='toy-stage toy-'+current;stage.innerHTML=''; if(current==='soap')renderSoap();if(current==='bubble')renderBubble();if(current==='smash')renderSmash()}
function renderSoap(){setTimer(false);hint.textContent='tap once · watch the whole bar curl away';stage.innerHTML=`<div class="soap-scene"><div class="blade" aria-label="slicer"></div><div class="soap-block"><span class="soap-label">soft</span></div></div>`;let count=0,running=false;const total=18,scene=$('.soap-scene'),block=$('.soap-block'),blade=$('.blade');function slice(){if(count>=total)return;count++;const shaving=document.createElement('i');shaving.className='shaving';shaving.style.right=`${-10-count*4}px`;shaving.style.height=`${140-Math.floor(count/4)*5}px`;shaving.style.transform=`rotate(${(count-9)*1.3}deg)`;block.appendChild(shaving);const startWidth=parseFloat(block.dataset.startWidth||(block.dataset.startWidth=getComputedStyle(block).width));block.style.width=`${Math.max(36,startWidth-count*(startWidth-36)/total)}px`;blade.animate([{transform:'translateX(-50%) rotate(-4deg) translateY(0)'},{transform:'translateX(-50%) rotate(-4deg) translateY(145px)'},{transform:'translateX(-50%) rotate(-4deg) translateY(0)'}],{duration:460,easing:'cubic-bezier(.3,.7,.2,1)'});soapSound();buzz(8);if(count===total)setTimeout(complete,520)}function startSlicing(){if(running)return;running=true;hint.textContent='watch the whole bar curl away';slice();const sequence=setInterval(()=>{slice();if(count>=total)clearInterval(sequence)},410)}function complete(){scene.classList.add('complete');const done=document.createElement('div');done.className='soap-done';done.innerHTML=`FULLY SLICED<small>${total} SOFT CURLS</small>`;scene.appendChild(done);hint.textContent='fully sliced · again whenever you want';showToast('a whole bar of curls.');buzz([12,18,24])}scene.addEventListener('pointerdown',startSlicing)}
function renderBubble(){setTimer(false);hint.textContent='tap, swipe, pop · resets when you finish';const grid=document.createElement('div');grid.className='bubble-grid';for(let i=0;i<48;i++){const b=document.createElement('button');b.className='bubble';b.setAttribute('aria-label',`bubble ${i+1}`);b.onpointerenter=e=>{if(e.buttons)pop(b)};b.onclick=()=>pop(b);grid.appendChild(b)}stage.querySelectorAll('.bubble-grid').forEach(x=>x.remove());stage.replaceChildren(grid);function pop(b){if(b.classList.contains('popped'))return;b.classList.add('popped');bubbleSound();buzz(7);if($$('.bubble.popped').length===48){showToast('every last one. nice.');setTimeout(()=>renderBubble(),900)}}}
function renderSmash(){setTimer(true);hint.textContent='nothing you type is saved';stage.innerHTML=`<div class="smash-scene"><div class="smash-prompt"><label for="annoyance">what needs wrecking?</label><input id="annoyance" class="smash-input" maxlength="20" autocomplete="off" placeholder="MONDAYS" aria-label="Type something to smash"><button class="smash-go">smash</button></div></div>`;const input=$('#annoyance');$('.smash-go').onclick=smash;input.onkeydown=e=>{if(e.key==='Enter')smash()};function smash(){const text=(input.value.trim()||'UGH').toUpperCase();input.value='';$('.smash-prompt').style.visibility='hidden';const burst=document.createElement('i');burst.className='smash-burst';stage.appendChild(burst);for(let i=0;i<Math.min(text.length,12);i++){const p=document.createElement('b');p.className='smash-piece';p.textContent=text[i];p.style.setProperty('--x',`${(Math.random()-.5)*620}px`);p.style.setProperty('--y',`${(Math.random()-.5)*480}px`);p.style.setProperty('--r',`${(Math.random()-.5)*520}deg`);p.style.animationDelay=`${i*55}ms`;stage.appendChild(p)}smashSound();buzz([20,25,35]);setTimeout(()=>{showToast('gone. one more?');renderSmash()},3400)}}
$$('.toy-card').forEach(b=>b.onclick=()=>openToy(b.dataset.toy));$('#backBtn').onclick=closeToy;$('#resetBtn').onclick=render;$('#soundBtn').onclick=()=>{sound=!sound;$('#soundBtn').setAttribute('aria-pressed',sound);$('.sound-label').textContent=sound?'sound on':'sound off';soundToggleCue();showToast(sound?'sound on':'sound off')};
window.addEventListener('hashchange',()=>{const n=location.hash.slice(1);if(['soap','bubble','smash'].includes(n)&&n!==current)openToy(n);else if(!n&&current)closeToy()});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
const initial=location.hash.slice(1);if(['soap','bubble','smash'].includes(initial))openToy(initial);
</script>
