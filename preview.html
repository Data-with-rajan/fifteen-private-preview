</style></head><body><header class="topbar"><a class="brand" href="#"><span>15</span>FIFTEEN</a><button class="sound"><span class="sound-icon">♪</span><span class="sound-label">sound on</span></button></header><main><section class="view home-view active" id="home"><div class="intro"><p class="eyebrow">a small reset for a loud day</p><h1>Give your brain<br><em>fifteen seconds.</em></h1><p>No accounts. No streaks. Pick one thing and let your hands do the thinking.</p></div><div class="shelf"><button class="toy-card elastic-card" data-toy="elastic"><span class="card-no">01</span><span class="card-time">pull · release</span><span class="mini-elastic"><i style="--r:-5deg"></i><i style="--r:3deg"></i><i style="--r:-2deg"></i><i style="--r:4deg"></i><i style="--r:-4deg"></i></span><span class="card-copy"><strong>Elastic</strong><small>pull, feel, let go</small></span><span class="card-arrow">↗</span></button><button class="toy-card bubble-card" data-toy="bubble"><span class="card-no">02</span><span class="card-time">48 pops</span><span class="mini-bubbles"></span><span class="card-copy"><strong>Bubble Wrap</strong><small>pop every last one</small></span><span class="card-arrow">↗</span></button><button class="toy-card rain-card" data-toy="rain"><span class="card-no">03</span><span class="card-time">tap · glide</span><span class="mini-rain"></span><span class="card-copy"><strong>Rain</strong><small>make your own shower</small></span><span class="card-arrow">↗</span></button></div></section><section class="view play-view" id="play"><div class="play-head"><button class="back">← shelf</button><b class="title"></b><button class="reset">reset</button></div><div class="toy-stage"></div><p class="hint"></p></section></main><footer><span>made for restless moments</span><span>nothing is saved</span></footer><div id="toast"></div><script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];let current='',soundOn=true,audio;window.__fifteenSoundAudit={last:null,counts:{elastic:0,bubble:0,rain:0}};function ctx(){if(!soundOn)return null;audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function mark(k){window.__fifteenSoundAudit.last=k;window.__fifteenSoundAudit.counts[k]++}function buzz(v){if(navigator.vibrate)navigator.vibrate(v)}function bubbleSound(){const a=ctx();if(!a)return;mark('bubble');const n=window.__fifteenSoundAudit.counts.bubble,o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter(),t=a.currentTime,b=[520,670,590,760,430][n%5];o.type=n%5===0?'square':'sine';o.frequency.setValueAtTime(b,t);o.frequency.exponentialRampToValueAtTime(b*(n%2?1.42:.58),t+.075);f.type='highpass';f.frequency.value=180;g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);o.connect(f).connect(g).connect(a.destination);o.start(t);o.stop(t+.1)}function elasticSound(stretch,i){const a=ctx();if(!a)return;mark('elastic');const t=a.currentTime,base=150+i*42+stretch*2.2,o=a.createOscillator(),g=a.createGain(),o2=a.createOscillator(),g2=a.createGain();o.type='triangle';o.frequency.setValueAtTime(base*1.9,t);o.frequency.exponentialRampToValueAtTime(base,t+.42);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.48);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.5);o2.type='sine';o2.frequency.setValueAtTime(base*.5,t);o2.frequency.exponentialRampToValueAtTime(base*.25,t+.32);g2.gain.setValueAtTime(.09,t);g2.gain.exponentialRampToValueAtTime(.001,t+.38);o2.connect(g2).connect(a.destination);o2.start(t);o2.stop(t+.4)}function rainSound(x,y){const a=ctx();if(!a)return;mark('rain');const t=a.currentTime,base=330+(1-y)*360,o=a.createOscillator(),g=a.createGain(),o2=a.createOscillator(),g2=a.createGain();o.type='sine';o.frequency.setValueAtTime(base*1.75,t);o.frequency.exponentialRampToValueAtTime(base,t+.16);g.gain.setValueAtTime(.11,t);g.gain.exponentialRampToValueAtTime(.001,t+.42);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.45);o2.type='sine';o2.frequency.setValueAtTime(base*.5,t+.02);g2.gain.setValueAtTime(.055,t+.02);g2.gain.exponentialRampToValueAtTime(.001,t+.65);o2.connect(g2).connect(a.destination);o2.start(t+.02);o2.stop(t+.68)}function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1000)}function openToy(k){current=k;$('#home').classList.remove('active');$('#play').classList.add('active');$('.title').textContent=k==='bubble'?'Bubble Wrap':k[0].toUpperCase()+k.slice(1);history.replaceState(null,'','#'+k);render()}function closeToy(){current='';$('#play').classList.remove('active');$('#home').classList.add('active');history.replaceState(null,'',location.pathname)}function render(){const s=$('.toy-stage');s.className='toy-stage toy-'+current;s.replaceChildren();if(current==='bubble')renderBubble();if(current==='elastic')renderElastic();if(current==='rain')renderRain()}function renderBubble(){const s=$('.toy-stage');$('.hint').textContent='tap, swipe, pop · resets when you finish';const grid=document.createElement('div');grid.className='bubble-grid';for(let i=0;i<48;i++){const b=document.createElement('button');b.className='bubble';b.setAttribute('aria-label',`bubble ${i+1}`);b.onpointerenter=e=>{if(e.buttons)pop(b)};b.onclick=()=>pop(b);grid.appendChild(b)}s.appendChild(grid);function pop(b){if(b.classList.contains('popped'))return;b.classList.add('popped');bubbleSound();buzz(7);if($$('.bubble.popped').length===48){toast('every last one. nice.');setTimeout(renderBubble,800)}}}function renderElastic(){const s=$('.toy-stage');$('.hint').textContent='pull a string sideways · release · repeat';const board=document.createElement('div');board.className='elastic-board';board.innerHTML='<i class="elastic-rail top"></i><i class="elastic-rail bot
