function layout(){const r=cv.getBoundingClientRect();const DPR=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);c.setTransform(DPR,0,0,DPR,0,0);groundY=H*.8;sc=Math.min(W/330,(H*.68)/320)}
layout();window.addEventListener('resize',layout);
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.x,y:e.clientY-r.y}}
function onDuck(l){return l.x>-160&&l.x<160&&l.y>-330&&l.y<40}
function draw(now,sq){if(!pressing)sq+=.012*Math.sin(now/900);c.clearRect(0,0,W,H);c.save();c.translate(W/2,groundY);c.save();c.scale(sc,sc);c.beginPath();c.ellipse(0,4,96+52*sq,13+5*sq,0,0,Math.PI*2);c.fillStyle='rgba(45,39,31,'+(0.16+0.12*sq)+')';c.fill();c.restore();c.scale(sc*(1+.5*sq),sc*(1-.55*sq));const g=c.createLinearGradient(0,-300,0,0);g.addColorStop(0,'#ffdd6b');g.addColorStop(.55,'#ffd54a');g.addColorStop(1,'#f7b731');c.beginPath();c.ellipse(0,-100,106*(1+.28*sq),96,0,0,Math.PI*2);c.fillStyle=g;c.fill();c.beginPath();c.moveTo(72+30*sq,-152);c.quadraticCurveTo(122+34*sq,-162,118+30*sq,-124);c.quadraticCurveTo(96+26*sq,-134,68+24*sq,-126);c.closePath();c.fillStyle='#f2b53a';c.fill();c.save();c.translate(28+34*sq,-96);c.rotate(-.35-.3*sq);c.beginPath();c.ellipse(0,0,47,31,0,0,Math.PI*2);c.fillStyle='#f2b53a';c.fill();c.restore();const hd=92*sq;c.beginPath();c.arc(-8,-226+hd,63,0,Math.PI*2);c.fillStyle=g;c.fill();c.save();c.globalAlpha=.22;c.beginPath();c.ellipse(-30,-258+hd,26,15,-.5,0,Math.PI*2);c.fillStyle='#fff';c.fill();c.restore();c.beginPath();c.ellipse(-72,-222+hd,27*(1+.2*sq),16*(1-.3*sq),0,0,Math.PI*2);c.fillStyle='#ff8f3c';c.fill();c.beginPath();c.ellipse(-68,-212+hd,19,9,0,0,Math.PI*2);c.fillStyle='#f07f2e';c.fill();const closed=sq>.45||(now<blinkT);if(closed){c.beginPath();c.arc(-24,-244+hd,10,Math.PI*.15,Math.PI*.85);c.strokeStyle='#22211f';c.lineWidth=3.4;c.lineCap='round';c.stroke()}else{c.beginPath();c.arc(-24,-246+hd,9.5,0,Math.PI*2);c.fillStyle='#22211f';c.fill();c.beginPath();c.arc(-27,-249+hd,3.2,0,Math.PI*2);c.fillStyle='#fff';c.fill()}c.save();c.globalAlpha=.35+.5*sq;c.beginPath();c.arc(14,-210+hd,10+7*sq,0,Math.PI*2);c.fillStyle='#ff9d8a';c.fill();c.restore();c.restore()}
function frame(now){if(!cv.isConnected)return;const dt=Math.min(.05,(now-prevT)/1000||.016);prevT=now;const acc=(dst-ds)*220-dsv*(pressing?11:7.5);dsv+=acc*dt;ds+=dsv*dt;if(!pressing&&Math.abs(ds)<.004&&Math.abs(dsv)<.01){ds=0;dsv=0}if(now>nextBlink){blinkT=now+130;nextBlink=now+2600+Math.random()*2600}draw(now,clamp(ds,-.2,1.05));requestAnimationFrame(frame)}
requestAnimationFrame(frame);
cv.addEventListener('pointerdown',e=>{e.preventDefault();const p=pos(e);if(!onDuck({x:(p.x-W/2)/sc,y:(p.y-groundY)/sc}))return;pressing=true;cv.setPointerCapture(e.pointerId);grabY=p.y;lastBlip=ds;mark('squeak');sqTone(430,1000,.22,.3,30);sqBreath(.18,.13,1800);buzz(12)});
cv.addEventListener('pointermove',e=>{if(!pressing)return;const p=pos(e);dst=clamp(.15+(p.y-grabY)/70,0,1);const now=performance.now();if(Math.abs(dst-lastBlip)>.12&&now-lastBlipT>90){lastBlipT=now;lastBlip=dst;sqTone(500+430*dst,(500+430*dst)*1.4,.09,.22,16);sqBreath(.07,.1,2200);buzz(9)}if(dst>=.97&&!bigDone){bigDone=true;sqTone(400,1250,.36,.36,38);sqBreath(.3,.16,2000);setTimeout(()=>sqTone(1250,300,.34,.34,34),310);buzz([25,45,55])}});
function letGo(){if(!pressing)return;pressing=false;bigDone=false;dst=0;if(ds>.05){sqTone(980,430,.2,.3,26);sqBreath(.16,.12,1600);buzz(14)}}
cv.addEventListener('pointerup',letGo);cv.addEventListener('pointercancel',letGo)}
$$('.toy-card').forEach(b=>b.onclick=()=>openToy(b.dataset.toy));$('.back').onclick=closeToy;$('.reset').onclick=render;$('.sound').onclick=()=>{soundOn=!soundOn;$('.sound-label').textContent=soundOn?'sound on':'sound off';$('.sound-icon').textContent=soundOn?'♪':'×'};addEventListener('hashchange',()=>{const n=location.hash.slice(1);if(['elastic','bubble','rain','squeak'].includes(n))openToy(n);else closeToy()});const initial=location.hash.slice(1);if(['elastic','bubble','rain','squeak'].includes(initial))openToy(initial);
</script></body></html>
