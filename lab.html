<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>Fifteen - candidate lab</title><style>
:root{--paper:#f6f3ec;--ink:#22211f;--muted:#77736b;--line:rgba(34,33,31,.16);--coral:#dc6f5c}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif;overscroll-behavior:none}body{-webkit-tap-highlight-color:transparent;user-select:none;display:flex;flex-direction:column}button{font:inherit;color:inherit}.topbar{height:76px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,5vw,72px);border-bottom:1px solid var(--line)}.brand{color:inherit;text-decoration:none;font-weight:800;letter-spacing:.16em;font-size:12px;display:flex;align-items:center}.brand span{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:10px;border:1px solid;border-radius:50%;letter-spacing:0;font-size:11px}.top-right{display:flex;align-items:center;gap:14px}.badge{font:600 10px monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--coral);border:1px solid var(--coral);border-radius:99px;padding:5px 10px}.sound,.back,.reset{border:0;background:none;cursor:pointer;font:600 10px monospace;text-transform:uppercase;letter-spacing:.08em}.sound{display:flex;align-items:center;gap:8px;padding:12px}.sound-icon{display:grid;place-items:center;width:24px;height:24px;border:1px solid var(--line);border-radius:50%}main{flex:1 1 auto;min-height:0;overflow:auto}.home{padding:clamp(24px,5vw,50px) clamp(16px,5vw,72px) 30px}.home h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.03em;margin:0 0 6px;font-weight:750}.home .sub{color:var(--muted);font-size:14px;margin:0 0 26px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.tcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:6px;min-height:170px;padding:14px;cursor:pointer;transition:.2s;background:#fff}.tcard:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(45,39,31,.12)}.tcard:active{transform:scale(.98)}.tcard .no{font:600 10px monospace;color:var(--muted);letter-spacing:.1em}.tcard strong{display:block;font-size:17px;margin-top:8px}.tcard small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.tcard .mini{position:absolute;left:14px;right:14px;top:44px;height:64px}.play{display:none;flex-direction:column;height:100%}body.playing .home{display:none}body.playing .play{display:flex}.play-head{flex:0 0 auto;height:58px;padding:0 clamp(16px,4vw,55px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid var(--line)}.back{justify-self:start}.reset{justify-self:end}.title{font:600 10px monospace;letter-spacing:.11em;text-transform:uppercase}.stage{flex:1 1 auto;position:relative;min-height:0;overflow:hidden;touch-action:none}#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.hintbar{flex:0 0 auto;height:52px;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--line)}.hint{font:600 10px monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0;text-align:center;padding:0 16px}#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--paper);padding:11px 17px;border-radius:30px;font:600 10px monospace;transition:.25s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><header class="topbar"><a class="brand" href="preview.html"><span>15</span>FIFTEEN</a><div class="top-right"><span class="badge">candidate lab &middot; private test</span><button class="sound"><span class="sound-icon">&#9834;</span><span class="sound-label">sound on</span></button></div></header><main><section class="home"><h1>Candidate lab</h1><p class="sub">Not approved. Try each, then pick the best six.</p><div class="grid" id="grid"></div></section><section class="play"><div class="play-head"><button class="back">&larr; lab</button><b class="title"></b><button class="reset">reset</button></div><div class="stage"><canvas id="cv"></canvas></div></section></main><footer class="hintbar"><p class="hint"></p></footer><div id="toast"></div><script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
let soundOn=true,audio=null,master=null;
window.__fifteenSoundAudit={last:null,counts:{tape:0,coin:0,key:0,whoopee:0},audioState:'none',outputLevel:0};
function mark(k){window.__fifteenSoundAudit.last=k;window.__fifteenSoundAudit.counts[k]++}
function ctx(){if(!soundOn)return null;if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=1;window.__an=audio.createAnalyser();window.__an.fftSize=256;master.connect(window.__an);window.__an.connect(audio.destination)}if(audio.state==='suspended')audio.resume();window.__fifteenSoundAudit.audioState=audio.state;return audio}
function buzz(p){if(navigator.vibrate)navigator.vibrate(p)}
$('.sound').onclick=()=>{soundOn=!soundOn;$('.sound-label').textContent=soundOn?'sound on':'sound off';$('.sound-icon').textContent=soundOn?'\u266a':'\u00d7';if(soundOn)ctx()};
window.addEventListener('pointerdown',()=>ctx(),{capture:true});
function tone(f0,f1,dur,type,vol,vib){const a=ctx();if(!a)return;const t=a.currentTime,g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.setValueAtTime(vol,t+dur*.6);g.gain.exponentialRampToValueAtTime(.0001,t+dur);for(const det of[0,6]){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f0+det,t);o.frequency.exponentialRampToValueAtTime(f1+det,t+dur*.8);if(vib){const l=a.createOscillator();l.frequency.value=30;const lg=a.createGain();lg.gain.value=vib;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur+.05)}o.connect(g);o.start(t);o.stop(t+dur+.05)}g.connect(master)}
function noiseHit(dur,vol,f,q){const a=ctx();if(!a)return;const t=a.currentTime,len=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);const s2=a.createBufferSource();s2.buffer=b;const fl=a.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q||1;const g=a.createGain();g.gain.value=vol;s2.connect(fl);fl.connect(g);g.connect(master);s2.start(t)}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)}

const cv=$('#cv');let cc=cv.getContext('2d'),W=0,H=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fitCanvas(){const r=cv.getBoundingClientRect();const DPR=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cc.setTransform(DPR,0,0,DPR,0,0)}
window.addEventListener('resize',()=>{if(document.body.classList.contains('playing'))fitCanvas()});
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.x,y:e.clientY-r.y}}

const TOYS={
tape:{name:'Tape Measure',gest:'pull out \u00b7 release',hint:'pull the tape out \u00b7 let it snap back',init(){const T={len:0,lv:0,target:0,drag:false,gx:0,px:0,lastPuff:0};
 cv.onpointerdown=e=>{const p=pos(e);const caseX=W/2-150;if(p.y>H-190&&p.x>caseX-20){T.drag=true;cv.setPointerCapture(e.pointerId);T.gx=p.x;T.px=p.x}};
 cv.onpointermove=e=>{if(!T.drag)return;const p=pos(e);T.target=clamp(T.target+(p.x-T.px),0,W-140);T.px=p.x;const now=performance.now();if(Math.abs(p.x-T.gx)>0&&now-T.lastPuff>70){T.lastPuff=now;noiseHit(.05,.07,2600,.7)}};
 const end=()=>{if(!T.drag)return;T.drag=false;if(T.target>40){mark('tape');tone(300,1900,Math.min(.5,T.target/900),'sawtooth',.2,0);buzz([10,20,30])}T.target=0};
 cv.onpointerup=end;cv.onpointercancel=end;
 return {step(dt){const k=T.drag?26:60;const acc=(T.target-T.len)*k*T.drag?((T.target-T.len)*260-T.lv*(T.drag?14:9)):((0-T.len)*320-T.lv*10);T.lv+=acc*dt;T.len=clamp(T.len+T.lv*dt,0,W-120);if(!T.drag&&T.len<2&&Math.abs(T.lv)>240){noiseHit(.08,.3,900,1);tone(180,70,.12,'triangle',.28,0);T.lv=0;T.len=0;buzz(25)}if(!T.drag&&T.len<1){T.len=0;T.lv=0}},
 draw(){const cx0=W/2-150,cy0=H-170;cc.save();cc.translate(cx0,cy0);cc.beginPath();cc.roundRect(0,10,120,110,18);cc.fillStyle='#e8553f';cc.fill();cc.beginPath();cc.arc(60,65,34,0,7);cc.fillStyle='#c93e2c';cc.fill();cc.beginPath();cc.arc(60,65,20,0,7);cc.fillStyle='#f6f3ec';cc.fill();cc.restore();
 if(T.len>1){cc.save();cc.beginPath();cc.rect(cx0+118,cy0+38,T.len+30,26);cc.clip();cc.fillStyle='#ffd54a';cc.fillRect(cx0+118,cy0+38,T.len+30,26);cc.strokeStyle='rgba(34,33,31,.5)';cc.lineWidth=1;for(let x=0;x<T.len+30;x+=12){cc.beginPath();cc.moveTo(cx0+118+x,cy0+38);cc.lineTo(cx0+118+x,cy0+38+(x%60===0?12:7));cc.stroke()}cc.restore();cc.fillStyle='#9aa0a6';cc.fillRect(cx0+118+T.len,cy0+30,10,42);cc.fillRect(cx0+118+T.len,cy0+30,22,8)}}}}},
 coin:{name:'Coin Flick',gest:'flick up fast',hint:'flick the coin into the slot',init(){const T={x:0,y:0,vy:0,vx:0,fly:false,spin:0,drag:false,lx:0,ly:0,lt:0,home:0,slotHit:0};
 T.home=H-110;T.x=W/2;T.y=T.home;
 cv.onpointerdown=e=>{const p=pos(e);if(Math.hypot(p.x-T.x,p.y-T.y)<70){T.drag=true;T.fly=false;cv.setPointerCapture(e.pointerId);T.lx=p.x;T.ly=p.y;T.lt=performance.now()}};
 cv.onpointermove=e=>{if(!T.drag)return;const p=pos(e);T.x=p.x;T.y=p.y;T.lx=p.x;T.ly=p.y;T.lt=performance.now()};
 const end=e=>{if(!T.drag)return;T.drag=false;mark('coin');const p=T;T.vy=clamp((p.ly-(T._py||p.ly)),-30,30);T.fly=true;T.vy=-16-Math.random()*3;T.vx=(Math.random()*2-1)*2;tone(600,1400,.3,'sine',.12,40);buzz(8)};
 cv.onpointerup=end;cv.onpointercancel=end;
 return {step(dt){if(T.fly){T.vy+=1.1;T.y+=T.vy;T.x+=T.vx;T.spin+=.5;if(T.y<120&&Math.abs(T.x-W/2)<55&&T.vy<0){T.fly=false;T.slotHit=1;T.y=T.home;T.x=W/2;tone(2400,2200,.09,'sine',.25,0);setTimeout(()=>tone(3100,2900,.12,'sine',.22,0),90);setTimeout(()=>tone(2100,1800,.16,'sine',.18,0),200);noiseHit(.05,.15,4000,2);buzz([12,30,18]);toast('clink. nice aim.')}if(T.y>T.home){T.fly=false;T.y=T.home;T.x=W/2;noiseHit(.07,.2,300,1);tone(220,90,.14,'triangle',.2,0);buzz(10)}}T.slotHit*=0.94},
 draw(){cc.save();cc.translate(W/2,86);const bw=150+10*T.slotHit;cc.beginPath();cc.roundRect(-bw/2,-30,bw,60,16);cc.fillStyle='#f2a7bb';cc.fill();cc.beginPath();cc.roundRect(-30,-4,60,8,4);cc.fillStyle='#8c4258';cc.fill();cc.beginPath();cc.arc(-bw/2+26,-24,10,0,7);cc.fillStyle='#f2a7bb';cc.fill();cc.restore();
 cc.save();cc.translate(T.x,T.y);const sq=Math.abs(Math.cos(T.spin))*.85+.15;cc.scale(sq,1);cc.beginPath();cc.arc(0,0,30,0,7);cc.fillStyle='#ffd54a';cc.fill();cc.lineWidth=3;cc.strokeStyle='#c8932a';cc.stroke();cc.beginPath();cc.arc(0,0,20,0,7);cc.strokeStyle='rgba(200,147,42,.6)';cc.lineWidth=2;cc.stroke();if(sq>.5){cc.fillStyle='#8a6414';cc.font='700 18px Arial';cc.textAlign='center';cc.fillText('15',0,6)}cc.restore();
 cc.strokeStyle='rgba(34,33,31,.2)';cc.lineWidth=2;cc.beginPath();cc.moveTo(0,T.home+34);cc.lineTo(W,T.home+34);cc.stroke()}}}},
 key:{name:'Big Key',gest:'press \u00b7 thock',hint:'press the key \u00b7 feel the bottom-out',init(){const T={press:0,pv:0,target:0,down:false,tilt:0};
 cv.onpointerdown=e=>{const p=pos(e);const kw=Math.min(W*.7,420),kh=200,kx=(W-kw)/2,ky=(H-kh)/2-20;if(p.x>kx&&p.x<kx+kw&&p.y>ky&&p.y<ky+kh){T.down=true;T.target=1;T.tilt=(p.x-(kx+kw/2))/(kw/2)*2;cv.setPointerCapture(e.pointerId);mark('key');tone(150,62,.14,'triangle',.4,0);noiseHit(.03,.22,1400,1.4);buzz(16)}};
 const end=()=>{if(!T.down)return;T.down=false;T.target=0;tone(880,1500,.045,'square',.14,0);noiseHit(.025,.12,3200,2);buzz(8)};
 cv.onpointerup=end;cv.onpointercancel=end;
 return {step(dt){const acc=(T.target-T.press)*420-T.pv*16;T.pv+=acc*dt;T.press=clamp(T.press+T.pv*dt,-.06,1)},
 draw(){const kw=Math.min(W*.7,420),kh=200,kx=(W-kw)/2,ky=(H-kh)/2-20,tr=T.press*13;cc.save();cc.translate(W/2,ky+kh/2);cc.rotate(T.tilt*.02*T.press);cc.translate(-W/2,-(ky+kh/2));cc.beginPath();cc.roundRect(kx,ky+16,kw,kh,22);cc.fillStyle='#b8b2a6';cc.fill();cc.beginPath();cc.roundRect(kx,ky+tr,kw,kh,22);const g=cc.createLinearGradient(kx,ky,kx,ky+kh);g.addColorStop(0,'#fdfcf8');g.addColorStop(1,'#e8e4da');cc.fillStyle=g;cc.fill();cc.lineWidth=2;cc.strokeStyle='rgba(34,33,31,.25)';cc.stroke();cc.fillStyle='#22211f';cc.font='600 22px monospace';cc.textAlign='center';cc.fillText('f i f t e e n',W/2,ky+tr+kh/2+8);cc.restore()}}}},
 whoopee:{name:'Whoopee',gest:'press \u00b7 hold',hint:'press the cushion \u00b7 slowly for best results',init(){const T={s:0,sv:0,target:0,down:false,pressT:0,rasp:null};
 cv.onpointerdown=e=>{const p=pos(e);if(Math.hypot(p.x-W/2,p.y-(H/2+40))<170){T.down=true;T.target=1;T.pressT=performance.now();cv.setPointerCapture(e.pointerId);mark('whoopee');const a=ctx();if(a){const t=a.currentTime,dur=.9;const o=a.createOscillator();o.type='square';o.frequency.setValueAtTime(210,t);o.frequency.exponentialRampToValueAtTime(85,t+dur);const l=a.createOscillator();l.type='sine';l.frequency.value=11;const lg=a.createGain();lg.gain.value=.8;const g=a.createGain();g.gain.setValueAtTime(.5,t);l.connect(lg);lg.connect(g.gain);g.gain.setValueAtTime(.26,t);g.gain.linearRampToValueAtTime(.2,t+dur);g.gain.linearRampToValueAtTime(.0001,t+dur+.05);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.06);l.start(t);l.stop(t+dur+.06);noiseHit(.5,.09,900,.6)}buzz([20,40,20,40,20])}};
 const end=()=>{if(!T.down)return;T.down=false;T.target=0;noiseHit(.14,.14,1400,.8)};
 cv.onpointerup=end;cv.onpointercancel=end;
 return {step(dt){const acc=(T.target-T.s)*160-T.sv*9;T.sv+=acc*dt;T.s=clamp(T.s+T.sv*dt,-.08,1)},
 draw(){const cx0=W/2,cy0=H/2+40,sq=T.s;cc.save();cc.translate(cx0,cy0);cc.scale(1+.45*sq,1-.5*sq);cc.beginPath();cc.moveTo(-140,10);cc.quadraticCurveTo(-150,-70,-70,-78);cc.quadraticCurveTo(-30,-84,-8,-70);cc.quadraticCurveTo(0,-88,30,-80);cc.quadraticCurveTo(130,-72,140,0);cc.quadraticCurveTo(146,60,60,74);cc.quadraticCurveTo(-60,86,-140,10);cc.closePath();const g=cc.createLinearGradient(0,-90,0,90);g.addColorStop(0,'#ef8a76');g.addColorStop(1,'#d65f4a');cc.fillStyle=g;cc.fill();cc.lineWidth=2.5;cc.strokeStyle='rgba(120,40,30,.4)';cc.stroke();cc.beginPath();cc.ellipse(-40,-30,34,16,-.4,0,7);cc.fillStyle='rgba(255,255,255,.25)';cc.fill();cc.save();cc.rotate(-.15);cc.fillStyle='#7d2c1e';cc.font='700 20px monospace';cc.textAlign='center';cc.fillText('POOT',10,10);cc.restore();cc.restore()}}}}
};
let current=null,toy=null,prevT=0;
function loop(now){if(!toy)return;const dt=Math.min(.05,(now-prevT)/1000||.016);prevT=now;toy.step(dt);cc.clearRect(0,0,W,H);toy.draw();requestAnimationFrame(loop)}
function open(k){current=k;document.body.classList.add('playing');$('.title').textContent=TOYS[k].name;$('.hint').textContent=TOYS[k].hint;history.replaceState(null,'','#'+k);fitCanvas();toy=TOYS[k].init();prevT=performance.now();requestAnimationFrame(loop)}
function close(){current=null;toy=null;document.body.classList.remove('playing');history.replaceState(null,'',location.pathname)}
$('.back').onclick=close;$('.reset').onclick=()=>{if(current)open(k=current)};
const grid=$('#grid');Object.entries(TOYS).forEach(([k,v],i)=>{const b=document.createElement('button');b.className='tcard';b.innerHTML='<span class="no">C'+(i+1)+'</span><span class="mini"></span><strong>'+v.name+'</strong><small>'+v.gest+'</small>';b.onclick=()=>open(k);grid.appendChild(b)});
addEventListener('hashchange',()=>{const n=location.hash.slice(1);if(TOYS[n])open(n);else close()});
const init0=location.hash.slice(1);if(TOYS[init0])open(init0);
</script></body></html>
