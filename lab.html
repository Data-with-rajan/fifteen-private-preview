<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>Fifteen - candidate lab</title><style>
:root{--paper:#f6f3ec;--ink:#22211f;--muted:#77736b;--line:rgba(34,33,31,.16);--coral:#dc6f5c}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif;overscroll-behavior:none}body{-webkit-tap-highlight-color:transparent;user-select:none;display:flex;flex-direction:column}button{font:inherit;color:inherit}.topbar{height:76px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,5vw,72px);border-bottom:1px solid var(--line)}.brand{color:inherit;text-decoration:none;font-weight:800;letter-spacing:.16em;font-size:12px;display:flex;align-items:center}.brand span{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:10px;border:1px solid;border-radius:50%;letter-spacing:0;font-size:11px}.top-right{display:flex;align-items:center;gap:14px}.badge{font:600 10px monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--coral);border:1px solid var(--coral);border-radius:99px;padding:5px 10px}.sound,.back,.reset{border:0;background:none;cursor:pointer;font:600 10px monospace;text-transform:uppercase;letter-spacing:.08em}.sound{display:flex;align-items:center;gap:8px;padding:12px}.sound-icon{display:grid;place-items:center;width:24px;height:24px;border:1px solid var(--line);border-radius:50%}main{flex:1 1 auto;min-height:0;overflow:auto}.home{padding:clamp(24px,5vw,50px) clamp(16px,5vw,72px) 30px}.home h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.03em;margin:0 0 6px;font-weight:750}.home .sub{color:var(--muted);font-size:14px;margin:0 0 26px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.tcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:6px;min-height:170px;padding:14px;cursor:pointer;transition:.2s;background:#fff}.tcard:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(45,39,31,.12)}.tcard:active{transform:scale(.98)}.tcard .no{font:600 10px monospace;color:var(--muted);letter-spacing:.1em}.tcard strong{display:block;font-size:17px;margin-top:8px}.tcard small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.tcard .mini{position:absolute;left:14px;right:14px;top:44px;height:64px}.play{display:none;flex-direction:column;height:100%}body.playing .home{display:none}body.playing .play{display:flex}.play-head{flex:0 0 auto;height:58px;padding:0 clamp(16px,4vw,55px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid var(--line)}.back{justify-self:start}.reset{justify-self:end}.title{font:600 10px monospace;letter-spacing:.11em;text-transform:uppercase}.stage{flex:1 1 auto;position:relative;min-height:0;overflow:hidden;touch-action:none}#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.hintbar{flex:0 0 auto;height:52px;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--line)}.hint{font:600 10px monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0;text-align:center;padding:0 16px}#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--paper);padding:11px 17px;border-radius:30px;font:600 10px monospace;transition:.25s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><header class="topbar"><a class="brand" href="preview.html"><span>15</span>FIFTEEN</a><div class="top-right"><span class="badge">candidate lab &middot; private test</span><button class="sound"><span class="sound-icon">&#9834;</span><span class="sound-label">sound on</span></button></div></header><main><section class="home"><h1>Candidate lab</h1><p class="sub">Round two. Retest Scratch Card + Balloon Pop, then try the three new ones.</p><div class="grid" id="grid"></div></section><section class="play"><div class="play-head"><button class="back">&larr; lab</button><b class="title"></b><button class="reset">reset</button></div><div class="stage"><canvas id="cv"></canvas></div></section></main><footer class="hintbar"><p class="hint"></p></footer><div id="toast"></div><script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
let soundOn=true,audio=null,master=null;
window.__fifteenSoundAudit={last:null,counts:{tape:0,coin:0,key:0,whoopee:0},audioState:'none',outputLevel:0};
function mark(k){window.__fifteenSoundAudit.last=k;window.__fifteenSoundAudit.counts[k]=(window.__fifteenSoundAudit.counts[k]||0)+1}
function ctx(){if(!soundOn)return null;if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=1;window.__an=audio.createAnalyser();window.__an.fftSize=256;master.connect(window.__an);window.__an.connect(audio.destination)}if(audio.state==='suspended')audio.resume();window.__fifteenSoundAudit.audioState=audio.state;return audio}
function buzz(p){if(navigator.vibrate)navigator.vibrate(p)}
$('.sound').onclick=()=>{soundOn=!soundOn;$('.sound-label').textContent=soundOn?'sound on':'sound off';$('.sound-icon').textContent=soundOn?'\u266a':'\u00d7';if(soundOn)ctx()};
window.addEventListener('pointerdown',()=>ctx(),{capture:true});
function tone(f0,f1,dur,type,vol,vib){const a=ctx();if(!a)return;const t=a.currentTime,g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.setValueAtTime(vol,t+dur*.6);g.gain.exponentialRampToValueAtTime(.0001,t+dur);for(const det of[0,6]){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f0+det,t);o.frequency.exponentialRampToValueAtTime(f1+det,t+dur*.8);if(vib){const l=a.createOscillator();l.frequency.value=30;const lg=a.createGain();lg.gain.value=vib;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur+.05)}o.connect(g);o.start(t);o.stop(t+dur+.05)}g.connect(master)}
function noiseHit(dur,vol,f,q){const a=ctx();if(!a)return;const t=a.currentTime,len=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);const s2=a.createBufferSource();s2.buffer=b;const fl=a.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q||1;const g=a.createGain();g.gain.value=vol;s2.connect(fl);fl.connect(g);g.connect(master);s2.start(t)}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)}

const cv=$('#cv');let cc=cv.getContext('2d'),W=0,H=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fitCanvas(){const r=cv.getBoundingClientRect();const DPR=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cc.setTransform(DPR,0,0,DPR,0,0)}
window.addEventListener('resize',()=>{if(document.body.classList.contains('playing'))fitCanvas()});
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.x,y:e.clientY-r.y}}

const TOYS={

 pinart:{name:'Pin Art',gest:'drag · imprint',hint:'drag your finger · push the pins',init(){const T={px:-999,py:-999,down:false,lmx:0,lmy:0};
 const N=14,M=18;const pins=[];for(let i=0;i<N*M;i++)pins.push({h:0,t:0});let lastS=0;
 cv.onpointerdown=e=>{T.down=true;const p=pos(e);T.px=p.x;T.py=p.y;cv.setPointerCapture(e.pointerId)};
 cv.onpointermove=e=>{if(!T.down)return;const p=pos(e);T.px=p.x;T.py=p.y};
 const end=()=>{T.down=false;T.px=-999;T.py=-999};cv.onpointerup=end;cv.onpointercancel=end;
 const geo=()=>{const bw=Math.min(W-40,420),bh=bw*(M/N);return{bw,bh,bx:(W-bw)/2,by:(H-bh)/2-10}};
 return {step(dt){const g=geo(),cw=g.bw/N,ch=g.bh/M;let moved=0;
  for(let j=0;j<M;j++)for(let i=0;i<N;i++){const P=pins[j*N+i];const gx=g.bx+i*cw+cw/2,gy=g.by+j*ch+ch/2;const d=Math.hypot(gx-T.px,gy-T.py);P.t=(T.down&&d<70)?(1-d/70):0;P.h+=(P.t-P.h)*Math.min(1,dt*14);if(T.down&&Math.abs(P.t-P.h)>.03)moved++}
  const now=performance.now();const pmd=Math.hypot(T.px-T.lmx,T.py-T.lmy);if(T.down&&pmd>2&&now-lastS>80){lastS=now;T.lmx=T.px;T.lmy=T.py;noiseHit(.03,.06,6500,1.2);if(Math.random()<.3)tone(2200+Math.random()*1800,1900,.05,'sine',.05,0);mark('pinart')}},
 draw(){const g=geo(),cw=g.bw/N,ch=g.bh/M;cc.save();cc.beginPath();cc.roundRect(g.bx-14,g.by-14,g.bw+28,g.bh+28,20);cc.fillStyle='#49474f';cc.fill();
  for(let j=0;j<M;j++)for(let i=0;i<N;i++){const P=pins[j*N+i];const gx=g.bx+i*cw+cw/2,gy=g.by+j*ch+ch/2;const l=Math.round(110+P.h*130);cc.strokeStyle='rgb('+l+','+l+','+Math.min(255,l+18)+')';cc.lineWidth=Math.max(2,cw*.45);cc.beginPath();cc.moveTo(gx,gy+4-P.h*3);cc.lineTo(gx,gy-4-P.h*8);cc.stroke()}cc.restore()}}}},

 plinko:{name:'Plinko',gest:'tap to drop',hint:'tap above the pegs · every drop lands somewhere',init(){const T={balls:[],pegs:[],notes:[523.25,587.33,659.25,783.99,880,1046.5],parts:[]};
 const bw=Math.min(W-30,400),bx=(W-bw)/2;for(let r=0;r<6;r++)for(let i=0;i<7;i++){T.pegs.push({x:bx+bw*(i+.5+(r%2?.5:0))/7,y:170+r*46,r:5})}
 cv.onpointerdown=e=>{const p=pos(e);if(p.y<230&&T.balls.length<6){T.balls.push({x:clamp(p.x,bx+14,bx+bw-14),y:60,vx:0,vy:0,life:9,row:-1});tone(900,600,.08,'sine',.08,0)}};
 return {step(dt){for(const b of T.balls){if(b.life<5){b.life-=dt;continue}b.vy+=1300*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.x<bx+10){b.x=bx+10;b.vx=Math.abs(b.vx)*.5}if(b.x>bx+bw-10){b.x=bx+bw-10;b.vx=-Math.abs(b.vx)*.5}
  for(const pg of T.pegs){const dx=b.x-pg.x,dy=b.y-pg.y,d=Math.hypot(dx,dy);if(d<13&&d>0){const nx=dx/d,ny=dy/d;b.x=pg.x+nx*13;b.y=pg.y+ny*13;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.7*vn*nx;b.vy-=1.7*vn*ny;b.vx+=(Math.random()*2-1)*30;const row=Math.round((pg.y-170)/46);const f=T.notes[clamp(row,0,5)];tone(f,f*.99,.16,'sine',.12,0);mark('plinko');buzz(4)}}}
  if(b.y>H-90){b.life=4.9;b.vx=0;b.vy=0;b.y=H-96;const bin=clamp(Math.floor((b.x-bx)/(bw/5)),0,4);tone(220,90,.16,'triangle',.2,0);noiseHit(.06,.15,700,1);buzz(10);toast('bin '+(bin+1)+'. every drop lands somewhere.')}}
  T.balls=T.balls.filter(b=>b.life>0)},
 draw(){cc.save();cc.strokeStyle='rgba(34,33,31,.25)';cc.lineWidth=2;cc.beginPath();cc.moveTo(bx+4,150);cc.lineTo(bx+4,H-70);cc.moveTo(bx+bw-4,150);cc.lineTo(bx+bw-4,H-70);cc.stroke();
  for(let i=0;i<=5;i++){cc.beginPath();cc.moveTo(bx+bw*i/5,H-130);cc.lineTo(bx+bw*i/5,H-70);cc.stroke()}
  cc.fillStyle='#77736b';for(const pg of T.pegs){cc.beginPath();cc.arc(pg.x,pg.y,pg.r,0,7);cc.fill()}
  for(const b of T.balls){const al=b.life<1?b.life:1;cc.globalAlpha=al;cc.beginPath();cc.arc(b.x,b.y,11,0,7);cc.fillStyle='#dc6f5c';cc.fill();cc.beginPath();cc.arc(b.x-3,b.y-3,3.5,0,7);cc.fillStyle='rgba(255,255,255,.5)';cc.fill();cc.globalAlpha=1}cc.restore()}}}},

 cradle:{name:'Cradle',gest:'pull · release',hint:'pull an end ball · let it clack',init(){const T={a:[0,0,0,0,0],va:[0,0,0,0,0],drag:-1};
 const L=Math.min(170,H*.26),R=Math.min(25,W*.055),gap=R*2+2,py=H/2-L-40;
 const ax=i=>W/2+(i-2)*gap;
 cv.onpointerdown=e=>{const p=pos(e);for(const i of[0,4]){const sgn=i===0?-1:1;const bx2=ax(i)+sgn*Math.sin(T.a[i])*L,by2=py+Math.cos(T.a[i])*L;if(Math.hypot(p.x-bx2,p.y-by2)<55){T.drag=i;cv.setPointerCapture(e.pointerId);break}}};
 cv.onpointermove=e=>{if(T.drag<0)return;const p=pos(e);const sgn=T.drag===0?-1:1;T.a[T.drag]=clamp(sgn*(p.x-ax(T.drag))/L,0,1.15)};
 const end=()=>{T.drag=-1};cv.onpointerup=end;cv.onpointercancel=end;
 const clack=()=>{mark('cradle');tone(2400,1750,.05,'square',.11,0);noiseHit(.025,.22,5200,2);buzz(7)};
 return {step(dt){for(const i of[0,4]){if(i===T.drag)continue;if(T.a[i]>0||Math.abs(T.va[i])>.001){T.va[i]+=-52*Math.sin(T.a[i])*dt;T.va[i]*=(1-.35*dt);T.a[i]+=T.va[i]*dt}}
  if(T.a[0]<=0&&T.va[0]<-.3){T.a[0]=0;T.va[4]=-T.va[0]*.95;T.va[0]=0;clack()}
  if(T.a[4]<=0&&T.va[4]<-.3){T.a[4]=0;T.va[0]=-T.va[4]*.95;T.va[4]=0;clack()}
  if(T.a[0]<0){T.a[0]=0;T.va[0]=0}if(T.a[4]<0){T.a[4]=0;T.va[4]=0}},
 draw(){cc.save();cc.strokeStyle='rgba(34,33,31,.45)';cc.lineWidth=5;cc.beginPath();cc.moveTo(ax(0)-30,py-6);cc.lineTo(ax(4)+30,py-6);cc.stroke();
  for(let i=0;i<5;i++){const sgn=i===0?-1:i===4?1:0;const a2=i===0||i===4?T.a[i]:0;const bx2=ax(i)+sgn*Math.sin(a2)*L,by2=py+Math.cos(a2)*L;cc.strokeStyle='rgba(34,33,31,.35)';cc.lineWidth=1.5;cc.beginPath();cc.moveTo(ax(i),py);cc.lineTo(bx2,by2);cc.stroke();const g=cc.createRadialGradient(bx2-R*.3,by2-R*.35,R*.15,bx2,by2,R);g.addColorStop(0,'#f2f0ea');g.addColorStop(.6,'#b9b5ac');g.addColorStop(1,'#7c786f');cc.beginPath();cc.arc(bx2,by2,R,0,7);cc.fillStyle=g;cc.fill()}cc.restore()}}}},

 scratch:{name:'Scratch Card',gest:'rub to reveal',hint:'rub the card · see what is under it',init(){const T={done:false,last:0,px:0,py:0,down:false};
 const bw=Math.min(W-40,380),bh=210,bx=(W-bw)/2,by=(H-bh)/2-20;
 const off=document.createElement('canvas');off.width=bw*2;off.height=bh*2;const oc=off.getContext('2d');oc.fillStyle='#b0aa9d';oc.fillRect(0,0,off.width,off.height);oc.fillStyle='rgba(255,255,255,.22)';for(let i=0;i<50;i++)oc.fillRect(Math.random()*off.width,Math.random()*off.height,34,3);oc.fillStyle='rgba(34,33,31,.28)';oc.font='600 26px monospace';oc.textAlign='center';oc.fillText('rub here',off.width/2,off.height/2+9);
 const rub=(x,y)=>{oc.globalCompositeOperation='destination-out';oc.beginPath();oc.arc((x-bx)*2,(y-by)*2,46,0,7);oc.fill()};
 cv.onpointerdown=e=>{const p=pos(e);if(!T.done&&p.x>bx&&p.x<bx+bw&&p.y>by&&p.y<by+bh){T.down=true;cv.setPointerCapture(e.pointerId);T.px=p.x;T.py=p.y;rub(p.x,p.y)}};
 cv.onpointermove=e=>{if(!T.down)return;const p=pos(e);if(Math.hypot(p.x-T.px,p.y-T.py)>4){rub(p.x,p.y);const now=performance.now();if(now-T.last>60){T.last=now;T.rubs=(T.rubs||0)+1;noiseHit(.05,.08,1100,1);tone(640+T.rubs*36,860+T.rubs*36,.06,'triangle',.05,0);mark('scratch')}T.px=p.x;T.py=p.y}};
 const end=()=>{if(!T.down)return;T.down=false;if(!T.done){const img=oc.getImageData(0,0,off.width,off.height).data;let cl=0,tot=0;for(let i=3;i<img.length;i+=64){tot++;if(img[i]===0)cl++}if(cl/tot>.5){T.done=true;tone(523,523,.12,'triangle',.14,0);setTimeout(()=>tone(784,784,.14,'triangle',.13,0),110);setTimeout(()=>tone(1047,1047,.22,'triangle',.12,0),230);mark('scratch');toast('nothing under here. just calm.')}}};
 cv.onpointerup=end;cv.onpointercancel=end;
 return {step(){},draw(){cc.save();cc.beginPath();cc.roundRect(bx,by,bw,bh,16);cc.fillStyle='#f9ead0';cc.fill();cc.save();cc.beginPath();cc.roundRect(bx,by,bw,bh,16);cc.clip();cc.fillStyle='#22211f';cc.font='600 19px monospace';cc.textAlign='center';cc.fillText('nothing under here.',bx+bw/2,by+bh/2-6);cc.fillText('just calm.',bx+bw/2,by+bh/2+20);if(!T.done)cc.drawImage(off,bx,by,bw,bh);cc.restore();cc.lineWidth=2;cc.strokeStyle='rgba(34,33,31,.25)';cc.beginPath();cc.roundRect(bx,by,bw,bh,16);cc.stroke();cc.restore()}}}},

 balloon:{name:'Balloon Pop',gest:'tap fast · score',hint:'pop balloons to score · hurdles steal them',init(){const T={bs:[],parts:[],hs:[],spawn:0,score:0,combo:0,lastPop:0};
 const cols=['#dc6f5c','#e8a33f','#7ca9ca','#8bb8b1','#b987ca'];
 for(let i=0;i<3;i++)T.hs.push({x:Math.random()*W,y:190+i*110,vx:(i%2?1:-1)*(40+i*18),w:70+Math.random()*30});
 cv.onpointerdown=e=>{const p=pos(e);for(let i=T.bs.length-1;i>=0;i--){const b=T.bs[i];if(Math.hypot(p.x-b.x,p.y-b.y)<b.r+16){T.bs.splice(i,1);const now=performance.now();T.combo=(now-T.lastPop<700)?T.combo+1:0;T.lastPop=now;T.score++;mark('balloon');const f=420+Math.min(8,T.combo)*60+(44-b.r)*6;tone(f,f*2.1,.08,'square',.17,0);noiseHit(.04,.18,2200,1);buzz(8);for(let k=0;k<10;k++)T.parts.push({x:b.x,y:b.y,vx:(Math.random()*2-1)*140,vy:(Math.random()*2-1)*140-40,life:.5,c:b.c});break}}};
 return {step(dt){T.spawn-=dt;if(T.spawn<=0&&T.bs.length<7){T.spawn=.55;const r=22+Math.random()*18;T.bs.push({x:34+Math.random()*(W-68),y:H+50,r,vy:-(58+Math.random()*42),wob:Math.random()*7,c:cols[Math.floor(Math.random()*cols.length)]})}
  for(const h of T.hs){h.x+=h.vx*dt;if(h.x<-h.w-10)h.x=W+10;if(h.x>W+10)h.x=-h.w-10}
  for(const b of T.bs){b.y+=b.vy*dt;b.wob+=dt*2.6;b.x+=Math.sin(b.wob)*16*dt;
   for(const h of T.hs){if(!b.dead&&b.y>h.y-8&&b.y<h.y+8&&b.x>h.x&&b.x<h.x+h.w){b.dead=true;noiseHit(.08,.14,500,.8);tone(240,110,.12,'triangle',.12,0);buzz(10);for(let k=0;k<8;k++)T.parts.push({x:b.x,y:b.y,vx:(Math.random()*2-1)*90,vy:(Math.random()*2-1)*90,life:.4,c:'#b8b2a6'})}}}
  T.bs=T.bs.filter(b=>!b.dead&&b.y>-90);
  for(const q of T.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=320*dt;q.life-=dt}
  T.parts=T.parts.filter(q=>q.life>0)},
 draw(){for(const h of T.hs){cc.save();cc.translate(h.x,h.y);cc.beginPath();cc.roundRect(0,-7,h.w,14,7);cc.fillStyle='#49474f';cc.fill();cc.fillStyle='#dc6f5c';for(let sx=8;sx<h.w-6;sx+=18)cc.fillRect(sx,-7,9,14);cc.restore()}
  for(const b of T.bs){cc.save();cc.translate(b.x,b.y);cc.beginPath();cc.ellipse(0,0,b.r*.86,b.r,0,0,7);cc.fillStyle=b.c;cc.fill();cc.beginPath();cc.ellipse(-b.r*.3,-b.r*.35,b.r*.22,b.r*.32,-.5,0,7);cc.fillStyle='rgba(255,255,255,.35)';cc.fill();cc.beginPath();cc.moveTo(0,b.r);cc.lineTo(-4,b.r+10);cc.lineTo(4,b.r+10);cc.closePath();cc.fillStyle=b.c;cc.fill();cc.restore()}
  for(const q of T.parts){cc.globalAlpha=Math.max(0,q.life/.5);cc.fillStyle=q.c;cc.fillRect(q.x-3,q.y-3,6,6);cc.globalAlpha=1}
  cc.fillStyle='#22211f';cc.font='700 22px monospace';cc.textAlign='left';cc.fillText('score '+T.score,16,34)}}}},
 bottle:{name:'Bottle Break',gest:'fling · smash',hint:'fling the bottle · hear it smash',init(){const T={x:W/2,y:H-170,vx:0,vy:0,rot:0,fly:false,drag:false,broken:false,shards:[],trail:[],resp:0};
 const floor=()=>H-80;
 cv.onpointerdown=e=>{const p=pos(e);if(!T.broken&&!T.fly&&Math.hypot(p.x-T.x,p.y-T.y)<70){T.drag=true;T.trail=[];cv.setPointerCapture(e.pointerId)}};
 cv.onpointermove=e=>{if(!T.drag)return;const p=pos(e);T.x=p.x;T.y=p.y;T.trail.push({x:p.x,y:p.y,t:performance.now()});if(T.trail.length>6)T.trail.shift()};
 const smash=()=>{T.broken=true;T.fly=false;T.drag=false;mark('bottle');noiseHit(.22,.32,3200,.6);for(let k=0;k<6;k++)setTimeout(()=>tone(2600+Math.random()*2600,1900,.06,'sine',.07,0),40*k);buzz([15,30,15]);for(let k=0;k<14;k++)T.shards.push({x:T.x,y:T.y,vx:(Math.random()*2-1)*260,vy:-Math.random()*300-60,r:Math.random()*6.3,life:1.1});T.resp=performance.now()+900};
 const end=()=>{if(!T.drag)return;T.drag=false;if(T.trail.length>=2){const a=T.trail[0],b=T.trail[T.trail.length-1],dt2=Math.max(16,b.t-a.t);T.vx=(b.x-a.x)/dt2*1000;T.vy=(b.y-a.y)/dt2*1000;T.fly=true;if(Math.hypot(T.vx,T.vy)>240)noiseHit(.15,.1,1400,.8)}};
 cv.onpointerup=end;cv.onpointercancel=end;
 return {step(dt){if(T.fly&&!T.broken){T.vy+=1200*dt;T.x+=T.vx*dt;T.y+=T.vy*dt;T.rot+=T.vx*.0004+dt*2;if(T.y>floor()-40&&T.vy>200)smash();else if((T.x<24&&T.vx<-240)||(T.x>W-24&&T.vx>240))smash();else if(T.y>floor()-40){T.y=floor()-40;T.vy*=-.35;T.vx*=.6;tone(900,420,.06,'triangle',.1,0);if(Math.abs(T.vy)<60){T.fly=false;T.rot=0}}}
  for(const s3 of T.shards){s3.x+=s3.vx*dt;s3.y+=s3.vy*dt;s3.vy+=900*dt;s3.r+=dt*7;s3.life-=dt}
  T.shards=T.shards.filter(s3=>s3.life>0&&s3.y<floor()+10);
  if(T.broken&&performance.now()>T.resp){T.broken=false;T.shards=[];T.x=W/2;T.y=floor()-90;T.rot=0}},
 draw(){cc.strokeStyle='rgba(34,33,31,.15)';cc.lineWidth=2;cc.beginPath();cc.moveTo(0,floor()+36);cc.lineTo(W,floor()+36);cc.stroke();
  for(const s3 of T.shards){cc.save();cc.translate(s3.x,s3.y);cc.rotate(s3.r);cc.globalAlpha=Math.max(0,Math.min(1,s3.life));cc.fillStyle='rgba(140,190,170,.85)';cc.beginPath();cc.moveTo(0,0);cc.lineTo(9,3);cc.lineTo(3,10);cc.closePath();cc.fill();cc.globalAlpha=1;cc.restore()}
  if(!T.broken){cc.save();cc.translate(T.x,T.y);cc.rotate(T.drag?Math.sin(performance.now()/90)*.06:T.rot);cc.beginPath();cc.roundRect(-24,-40,48,80,14);cc.fillStyle='#7fb89f';cc.fill();cc.beginPath();cc.roundRect(-9,-62,18,26,6);cc.fill();cc.fillStyle='#4e7a67';cc.beginPath();cc.roundRect(-11,-70,22,10,4);cc.fill();cc.beginPath();cc.ellipse(-9,-16,7,20,.3,0,7);cc.fillStyle='rgba(255,255,255,.3)';cc.fill();cc.restore()}}}}},
 chicken:{name:'Rubber Chicken',gest:'squeeze · squeal',hint:'squeeze the chicken · slow is funnier',init(){const T={s:0,down:false,osc:null,g:null,leg:0};
 const stopSqueal=()=>{if(T.osc){try{const a2=ctx();if(a2){const t2=a2.currentTime;T.g.gain.linearRampToValueAtTime(.0001,t2+.25);T.osc.frequency.linearRampToValueAtTime(280,t2+.25);T.osc.stop(t2+.3);T.osc._lfo.stop(t2+.3)}}catch(e){}T.osc=null;T.g=null}};
 cv.onpointerdown=e=>{const p=pos(e);if(Math.hypot(p.x-W/2,p.y-H/2)<180){T.down=true;cv.setPointerCapture(e.pointerId);mark('chicken');const a=ctx();if(a){const t2=a.currentTime;T.osc=a.createOscillator();T.osc.type='sawtooth';T.osc.frequency.setValueAtTime(380,t2);const l=a.createOscillator();l.frequency.value=13;const lg=a.createGain();lg.gain.value=40;l.connect(lg);lg.connect(T.osc.frequency);l.start(t2);T.osc._lfo=l;T.g=a.createGain();T.g.gain.setValueAtTime(.0001,t2);T.g.gain.linearRampToValueAtTime(.2,t2+.06);T.osc.connect(T.g);T.g.connect(master);T.osc.start(t2)}}};
 const end=()=>{if(!T.down)return;T.down=false;stopSqueal()};cv.onpointerup=end;cv.onpointercancel=end;
 return {step(dt){T.s+=((T.down?1:0)-T.s)*Math.min(1,dt*7);T.leg+=dt*(2+T.s*16);if(T.osc&&T.down)T.osc.frequency.value=380+T.s*560},
 draw(){const cx0=W/2,cy0=H/2;cc.save();cc.translate(cx0,cy0);cc.scale(1+.5*T.s,1-.35*T.s);
  cc.beginPath();cc.ellipse(0,0,52,105,0,0,7);cc.fillStyle='#ffd54a';cc.fill();cc.lineWidth=2.5;cc.strokeStyle='rgba(140,100,20,.5)';cc.stroke();
  cc.beginPath();cc.arc(0,-118,26,0,7);cc.fillStyle='#ffd54a';cc.fill();cc.stroke();
  cc.fillStyle='#e8553f';cc.beginPath();cc.arc(0,-146,9,0,7);cc.fill();cc.beginPath();cc.arc(-11,-140,8,0,7);cc.fill();cc.beginPath();cc.arc(11,-140,8,0,7);cc.fill();
  cc.beginPath();cc.moveTo(20,-118);cc.lineTo(42,-110);cc.lineTo(20,-102);cc.closePath();cc.fillStyle='#ff8f3c';cc.fill();
  cc.fillStyle='#22211f';cc.beginPath();cc.arc(8,-124,4,0,7);cc.fill();
  const lw=Math.sin(T.leg)*14*(0.3+T.s);cc.strokeStyle='#ff8f3c';cc.lineWidth=5;cc.beginPath();cc.moveTo(-18,100);cc.quadraticCurveTo(-24+lw,126,-16+lw,146);cc.moveTo(18,100);cc.quadraticCurveTo(24-lw,126,16-lw,146);cc.stroke();
  cc.restore()}}}},
 flush:{name:'Flush',gest:'pull · whoosh',hint:'pull the chain · watch it swirl away',init(){const T={pull:0,drag:false,flushing:0,water:1,swirl:0};
 const chainX=()=>W-90,topY=110;
 cv.onpointerdown=e=>{const p=pos(e);if(Math.hypot(p.x-chainX(),p.y-(topY+66+T.pull*70))<46&&!T.flushing){T.drag=true;cv.setPointerCapture(e.pointerId)}};
 cv.onpointermove=e=>{if(!T.drag)return;const p=pos(e);T.pull=clamp((p.y-(topY+60))/70,0,1)};
 const end=()=>{if(!T.drag)return;T.drag=false;if(T.pull>.6&&!T.flushing){T.flushing=1;mark('flush');noiseHit(.9,.3,420,.5);tone(160,70,.9,'sine',.14,30);for(let k=0;k<6;k++)setTimeout(()=>tone(300+Math.random()*200,200,.09,'sine',.05,20),300+k*160);buzz([20,40,20])}T.pull=0};cv.onpointerup=end;cv.onpointercancel=end;
 return {step(dt){if(T.flushing){T.swirl+=dt*9;if(T.flushing===1){T.water=Math.max(0,T.water-dt*1.1);if(T.water<=0){T.flushing=2;noiseHit(.5,.08,900,.6)}}else{T.water=Math.min(1,T.water+dt*.4);if(T.water>=1)T.flushing=0}}},
 draw(){const bw2=Math.min(W*.62,300),bx2=(W-bw2)/2,by2=H-260;
  cc.fillStyle='#f2efe8';cc.strokeStyle='rgba(34,33,31,.25)';cc.lineWidth=2;
  cc.beginPath();cc.roundRect(bx2,topY,bw2,74,10);cc.fill();cc.stroke();
  cc.beginPath();cc.roundRect(bx2+18,by2,bw2-36,150,26);cc.fill();cc.stroke();
  const wl=T.water,wx=W/2,wy=by2+80;
  cc.save();cc.beginPath();cc.ellipse(wx,wy,(bw2-76)/2,46,0,0,7);cc.clip();
  cc.fillStyle='rgba(124,169,202,'+(.25+.55*wl)+')';cc.fillRect(wx-bw2/2,wy+46-92*wl,bw2,92);
  if(wl>.02){cc.strokeStyle='rgba(255,255,255,.7)';cc.lineWidth=2.5;for(let k=0;k<3;k++){cc.beginPath();cc.arc(wx,wy,10+k*12,T.swirl+k*2,T.swirl+k*2+3.6);cc.stroke()}}
  cc.restore();
  cc.strokeStyle='#77736b';cc.lineWidth=2;cc.beginPath();cc.moveTo(chainX(),topY+8);cc.lineTo(chainX(),topY+60+T.pull*70);cc.stroke();cc.beginPath();cc.arc(chainX(),topY+66+T.pull*70,9,0,7);cc.fillStyle='#b8b2a6';cc.fill();cc.stroke()}}}}
};
let current=null,toy=null,prevT=0;
function loop(now){if(!toy)return;const dt=Math.min(.05,(now-prevT)/1000||.016);prevT=now;toy.step(dt);cc.clearRect(0,0,W,H);toy.draw();requestAnimationFrame(loop)}
function open(k){current=k;document.body.classList.add('playing');$('.title').textContent=TOYS[k].name;$('.hint').textContent=TOYS[k].hint;history.replaceState(null,'','#'+k);fitCanvas();toy=TOYS[k].init();prevT=performance.now();requestAnimationFrame(loop)}
function close(){current=null;toy=null;document.body.classList.remove('playing');history.replaceState(null,'',location.pathname)}
$('.back').onclick=close;$('.reset').onclick=()=>{if(current)open(k=current)};
const grid=$('#grid');Object.entries(TOYS).forEach(([k,v],i)=>{const b=document.createElement('button');b.className='tcard';b.innerHTML='<span class="no">C'+(i+1)+'</span><span class="mini"></span><strong>'+v.name+'</strong><small>'+v.gest+'</small>';b.onclick=()=>open(k);grid.appendChild(b)});
addEventListener('hashchange',()=>{const n=location.hash.slice(1);if(TOYS[n])open(n);else close()});
const init0=location.hash.slice(1);if(TOYS[init0])open(init0);
</script></body></html>
